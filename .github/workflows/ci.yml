# Checks every push and pull request: formatting and lints on Linux, then tests and a release
# build on macOS (Apple Silicon) and Windows (x64). The binaries are kept as workflow artifacts
# for a few days so anyone can try a commit without building it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifact: lumifi-macos-arm64
            binary: lumifi
          - name: Windows (x64)
            os: windows-latest
            artifact: lumifi-windows-x64
            binary: lumifi.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
          retention-days: 14
