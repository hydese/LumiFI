[package]
name = "lumifi"
description = "LumiFi: a small, light, high-quality music player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
gpui = "=0.2.2"
lumifi-engine.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
raw-window-handle = "0.6"
dirs = "5.0.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13"
ureq = { version = "3.5", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true

[dev-dependencies]
hound.workspace = true
