[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/hydese/lumifi"
authors = ["LumiFi contributors"]

[workspace.dependencies]
lumifi-engine = { path = "crates/engine" }
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
cpal = "0.18.2"
env_logger = "0.11.11"
hound = "3.5.1"
log = "0.4.35"
rtrb = "0.4.1"
rustfft = "6.4.1"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-opus = "0.1.3"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# gpui 0.2.2 pulls xattr 0.2.3, which no longer builds on Linux with the libc that cpal needs.
# See patches/README.md.
[patch.crates-io]
xattr = { path = "patches/xattr-0.2.3" }
